name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Verify native timing runner and timeout cleanup
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py' -v

      - name: Build EigenScript
        run: |
          git clone --branch v0.48.0 --depth 1 https://github.com/InauguralSystems/EigenScript.git /tmp/eigenscript
          cd /tmp/eigenscript && make build
          echo "/tmp/eigenscript/src" >> $GITHUB_PATH

      - name: Build drat-trim
        run: |
          git clone --depth 1 https://github.com/marijnheule/drat-trim.git /tmp/drat-trim
          cc -O2 -o /tmp/drat-trim/drat-trim /tmp/drat-trim/drat-trim.c
          echo "/tmp/drat-trim" >> $GITHUB_PATH

      - name: Run solver tests
        run: tests/run_smoke.sh

      - name: Verify UNSAT refutations (DRAT)
        run: tests/run_proof_check.sh

      # Every manifest row through --gf2 --cdcl: SAT models checked against the
      # original CNF, certified UNSAT refutations through drat-trim, and
      # elimination UNSAT must stay uncertified (hq#58 EMS-GF2-1).
      - name: Verify --gf2 answers (model / DRAT)
        run: tests/run_gf2_proof_check.sh

      # The randomized soundness oracle CLAUDE.md lists under "what actually
      # gates it": all four paths must agree, SAT models are checked and UNSAT
      # proofs go through drat-trim. Fixed seeds, so a red run reproduces with
      # the same command (hq#58 EMS-FUZZ-1).
      - name: Differential fuzz (seeds 0..59)
        env:
          EIGENSCRIPT_BIN: /tmp/eigenscript/src/eigenscript
        run: python3 tests/fuzz_differential.py 0 60

      # Kept out of run_smoke.sh on purpose: the hard families cost seconds per
      # solve and would push the smoke suite well past its runtime baseline.
      # Running it here keeps the mode from rotting.
      - name: Proof-shape benchmark
        run: eigenscript minisat.eigs --proof-bench --size 1

      # The CLI's CDCL path on a conflict-heavy checked-in fixture, byte for
      # byte against the regime-C bank. EigenScript#1995 crashed this path
      # while every step above stayed green.
      - name: Regime-C CDCL oracle (3x3 fixture, CLI)
        run: tests/run_regime_c_check.sh
